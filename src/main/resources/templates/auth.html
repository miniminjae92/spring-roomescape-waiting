<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomescape Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <header class="auth-header">
        <a href="/">ROOMESCAPE</a>
        <h1>로그인 또는 회원가입</h1>
        <p>예약과 내역 조회는 로그인 회원 기준으로 처리됩니다.</p>
    </header>
    <section class="auth-grid">
        <form id="login-form" class="auth-card">
            <h2>로그인</h2>
            <label>로그인 ID <input name="loginId" autocomplete="username" required></label>
            <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">로그인</button>
        </form>
        <form id="signup-form" class="auth-card">
            <h2>회원가입</h2>
            <label>이름 <input name="name" maxlength="20" required></label>
            <label>로그인 ID <input name="loginId" minlength="4" maxlength="30" required></label>
            <label>비밀번호 <input name="password" type="password" minlength="8" maxlength="100" required></label>
            <button type="submit">회원가입</button>
        </form>
    </section>
    <p id="auth-message" class="auth-message" aria-live="polite"></p>
</main>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
